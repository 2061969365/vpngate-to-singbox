name: Test vpngate-to-singbox converter

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly live check against the real VPNGate API

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m py_compile vpngate_to_singbox.py scripts/summarize_probe.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test on sample ovpn
        run: |
          python vpngate_to_singbox.py \
            --input tests/fixtures/vpngate_tcp_sample.ovpn \
            --output /tmp/singbox.json --tag vpngate-0
          python -m json.tool /tmp/singbox.json > /dev/null
          python - <<'EOF'
          import json
          cfg = json.load(open("/tmp/singbox.json"))
          ep = cfg["endpoints"][0]
          assert ep["type"] == "openvpn-client", ep
          assert ep["network"] == "tcp", ep
          assert ep["system"] is False, ep
          assert "BF-CBC" in ep["data_ciphers"], ep
          assert "BEGIN CERTIFICATE" in ep["tls"]["certificate"], ep
          print("converter assertions OK:", ep["server"], ep["server_port"])
          EOF
      - name: Upload generated config
        uses: actions/upload-artifact@v6
        with:
          name: singbox-sample-config
          path: /tmp/singbox.json

  singbox-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: singbox-sample-config
          path: /tmp
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
          ./sing-box-*/sing-box version
      - name: Validate config with sing-box check
        run: ./sing-box-*/sing-box check -c /tmp/singbox.json

  live-snapshot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch real VPNGate snapshot
        run: |
          for attempt in 1 2 3; do
            curl -m 20 -sSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv && break
            echo "fetch attempt $attempt failed, retrying..."
            sleep 5
          done
          test -s /tmp/vpngate.csv
          wc -c /tmp/vpngate.csv
          grep -c -v '^\*' /tmp/vpngate.csv
      - name: Convert top TCP nodes
        run: |
          python vpngate_to_singbox.py --csv /tmp/vpngate.csv \
            --limit 8 --output /tmp/singbox-live.json --tag vpngate
          python - <<'EOF'
          import json
          cfg = json.load(open("/tmp/singbox-live.json"))
          assert len(cfg["endpoints"]) >= 1, "no TCP endpoints converted"
          for ep in cfg["endpoints"]:
              assert ep["network"] == "tcp" and ep["system"] is False, ep
          print("live endpoints:", [(e["server"], e["server_port"]) for e in cfg["endpoints"]])
          EOF
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
      - name: Validate live config with sing-box check
        run: ./sing-box-*/sing-box check -c /tmp/singbox-live.json

  live-dial:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch real VPNGate snapshot
        run: |
          for attempt in 1 2 3; do
            curl -m 20 -sSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv && break
            echo "fetch attempt $attempt failed, retrying..."
            sleep 5
          done
          test -s /tmp/vpngate.csv
      - name: Convert top TCP nodes with mixed inbound
        run: |
          python vpngate_to_singbox.py --csv /tmp/vpngate.csv \
            --limit 3 --output /tmp/singbox-dial.json --tag vpngate \
            --mixed 127.0.0.1:18080
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
          ./sing-box-*/sing-box check -c /tmp/singbox-dial.json
      - name: Dial through VPNGate and verify exit IP
        run: |
          DIRECT_IP=$(curl -m 20 -s https://api.ipify.org)
          echo "runner direct IP: $DIRECT_IP"
          for i in 0 1 2; do
            pkill -f singbox-try || true
            python - "$i" <<'EOF'
          import json, sys
          i = sys.argv[1]
          cfg = json.load(open("/tmp/singbox-dial.json"))
          cfg["route"]["final"] = f"vpngate-{i}"
          json.dump(cfg, open("/tmp/singbox-try.json", "w"), indent=2)
          print("trying endpoint vpngate-" + i)
          EOF
            ./sing-box-*/sing-box run -c /tmp/singbox-try.json > /tmp/singbox-run.log 2>&1 &
            sleep 25
            if EXIT_IP=$(curl -m 60 -s -x socks5h://127.0.0.1:18080 https://api.ipify.org); then
              echo "exit IP via vpngate-$i: $EXIT_IP"
              if [ -n "$EXIT_IP" ] && [ "$EXIT_IP" != "$DIRECT_IP" ]; then
                echo "DIAL OK: traffic exits via VPNGate, no TUN used"
                pkill -f singbox-try || true
                exit 0
              fi
            fi
            echo "attempt vpngate-$i failed, see log tail:"
            tail -n 20 /tmp/singbox-run.log || true
          done
          pkill -f singbox-try || true
          echo "all dial attempts failed"
          exit 1

  live-stability:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch real VPNGate snapshot
        run: |
          for attempt in 1 2 3; do
            curl -m 20 -sSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv && break
            echo "fetch attempt $attempt failed, retrying..."
            sleep 5
          done
          test -s /tmp/vpngate.csv
          python vpngate_to_singbox.py --csv /tmp/vpngate.csv \
            --limit 3 --output /tmp/singbox-stab.json --tag vpngate \
            --mixed 127.0.0.1:18080
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
          ./sing-box-*/sing-box check -c /tmp/singbox-stab.json
      - name: Probe stability (6x latency + 10MB download per endpoint)
        run: |
          : > /tmp/probe.jsonl
          record() { python3 - "$@" <<'EOF'
          import json, sys
          argv = sys.argv + [""]
          rec = {"endpoint": argv[1], "kind": argv[2], "ok": argv[3] == "1",
                 "seconds": float(argv[4]), "mbps": float(argv[5] or 0.0),
                 "reason": argv[6] or ("ok" if argv[3] == "1" else "unknown")}
          open("/tmp/probe.jsonl", "a").write(json.dumps(rec) + "\n")
          print(rec, flush=True)
          EOF
          }
          for i in 0 1 2; do
            pkill -f singbox-stab || true
            python3 - "$i" <<'EOF'
          import json, sys
          cfg = json.load(open("/tmp/singbox-stab.json"))
          cfg["route"]["final"] = "vpngate-" + sys.argv[1]
          json.dump(cfg, open("/tmp/singbox-stab-try.json", "w"), indent=2)
          print("probing endpoint vpngate-" + sys.argv[1], flush=True)
          EOF
            ./sing-box-*/sing-box run -c /tmp/singbox-stab-try.json > /tmp/singbox-stab.log 2>&1 &
            sleep 25
            for r in 1 2 3 4 5 6; do
              if out=$(curl -m 20 -s -o /dev/null -x socks5h://127.0.0.1:18080 \
                  -w "%{http_code} %{time_total}" https://www.gstatic.com/generate_204); then
                set -- $out
                if [ "$1" = "204" ]; then record "vpngate-$i" latency 1 "$2" 0 "http_204"; else record "vpngate-$i" latency 0 "$2" 0 "http_$1"; fi
              else
                record "vpngate-$i" latency 0 0 0 "dial"
              fi
              sleep 8
            done
            if out=$(curl -m 90 -s -o /dev/null -x socks5h://127.0.0.1:18080 \
                -w "%{http_code} %{time_total} %{size_download}" "https://speed.cloudflare.com/__down?bytes=10000000"); then
              set -- $out
              mbps=$(python3 -c "print(round($3*8/float($2)/1e6, 2) if float($2) > 0 else 0)")
              if [ "$1" = "200" ] && [ "$3" != "0" ]; then record "vpngate-$i" speed 1 "$2" "$mbps" "dl_ok"; else record "vpngate-$i" speed 0 "$2" 0 "http_$1"; fi
            else
              record "vpngate-$i" speed 0 0 0 "dial"
            fi
          done
          pkill -f singbox-stab || true
          echo "--- probe.jsonl ---"
          cat /tmp/probe.jsonl
      - name: Summarize and gate
        run: |
          python scripts/summarize_probe.py --input /tmp/probe.jsonl --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Upload raw probe data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: probe-${{ github.run_id }}
          path: /tmp/probe.jsonl
          retention-days: 90
      - name: Append history to data branch
        if: always()
        run: |
          [ "${{ github.event_name }}" = "schedule" ] || { echo "not a scheduled run, skip"; exit 0; }
          [ -f /tmp/probe.jsonl ] || { echo "no probe data, skip"; exit 0; }
          python3 - <<'EOF'
          import datetime, json
          samples = [json.loads(l) for l in open("/tmp/probe.jsonl") if l.strip()]
          by_ep = {}
          for s in samples:
              e = by_ep.setdefault(s["endpoint"], {"lat_ok": 0, "lat_total": 0, "mbps": 0.0})
              if s["kind"] == "latency":
                  e["lat_total"] += 1
                  e["lat_ok"] += bool(s["ok"])
              elif s["ok"]:
                  e["mbps"] = max(e["mbps"], float(s.get("mbps", 0.0)))
          row = {"ts": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "run_id": "${{ github.run_id }}", "endpoints": by_ep}
          open("/tmp/history-row.jsonl", "w").write(json.dumps(row) + "\n")
          print("history row:", row)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin data 2>/dev/null || true
            git checkout -B data origin/data 2>/dev/null || git checkout -B data
            cat /tmp/history-row.jsonl >> history.jsonl
            git add history.jsonl
            git commit -m "stability history ${{ github.run_id }}" || { echo "nothing to commit"; exit 0; }
            git pull --rebase origin data 2>/dev/null || true
            git push origin data && break
            echo "push conflict, retrying..."
            sleep 10
          done
      - name: File tracking issue when gate is red
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create stability-tracking --color B60205 \
            --description "stability gate went red" 2>/dev/null || true
          body="Stability gate red: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label stability-tracking --state open --json number --jq '.[0].number')
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh issue create --title "Stability gate red" --body "$body" --label stability-tracking
          else
            gh issue comment "$existing" --body "$body"
          fi

  railway-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build railway image
        run: docker build -f Dockerfile.railway -t vpngate-railway:test .
      - name: Smoke test (boot + routes, no TUN)
        run: |
          docker run -d --name vpngate-test -p 8080:8080 \
            -e PORT=8080 -e PROXY_USER=u -e PROXY_PASS=0123456789abcdef \
            -e ADMIN_TOKEN=smoke-admin-token-0123456789 \
            vpngate-railway:test
          for i in $(seq 1 18); do
            if curl -m 5 -s http://127.0.0.1:8080/healthz | grep -q "^ok$"; then
              echo "healthz OK after ~$((i * 10))s"
              break
            fi
            sleep 10
          done
          curl -m 10 -s http://127.0.0.1:8080/healthz | grep -q "^ok$"
          curl -m 10 -s http://127.0.0.1:8080/ui | grep -q "api/status"
          if curl -m 10 -s http://127.0.0.1:8080/api/status | grep -q "401"; then
            echo "unauthenticated /api/status correctly rejected"
          else
            echo "expected 401 without token"; exit 1
          fi
          curl -m 10 -s -H "Authorization: Bearer smoke-admin-token-0123456789" \
            http://127.0.0.1:8080/api/status | tee /tmp/smoke-status.json | python3 -m json.tool
          python3 - <<'EOF'
          import json
          status = json.load(open("/tmp/smoke-status.json"))
          assert len(status["endpoints"]) >= 1, "smoke: no endpoints loaded"
          assert status["countries"], "smoke: no countries listed"
          assert status["refresh_ok"] >= 1, status
          print("smoke assertions OK:", len(status["endpoints"]), "endpoints,",
                len(status["countries"]), "countries")
          EOF
          curl -m 10 -s -X POST -H "Authorization: Bearer smoke-admin-token-0123456789" \
            http://127.0.0.1:8080/api/switch -d '{"tag":"auto"}' | grep -q '"ok": true'
          echo "switch-to-auto OK"
          echo "--- container log tail ---"
          docker logs vpngate-test 2>&1 | tail -n 10
      - name: Cleanup
        if: always()
        run: docker rm -f vpngate-test || true
