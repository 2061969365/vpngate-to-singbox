name: Test vpngate-to-singbox converter

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly live check against the real VPNGate API

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m py_compile vpngate_to_singbox.py scripts/summarize_probe.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test on sample ovpn
        run: |
          python vpngate_to_singbox.py \
            --input tests/fixtures/vpngate_tcp_sample.ovpn \
            --output /tmp/singbox.json --tag vpngate-0
          python -m json.tool /tmp/singbox.json > /dev/null
          python - <<'EOF'
          import json
          cfg = json.load(open("/tmp/singbox.json"))
          ep = cfg["endpoints"][0]
          assert ep["type"] == "openvpn-client", ep
          assert ep["network"] == "tcp", ep
          assert ep["system"] is False, ep
          assert "BF-CBC" in ep["data_ciphers"], ep
          assert "BEGIN CERTIFICATE" in ep["tls"]["certificate"], ep
          print("converter assertions OK:", ep["server"], ep["server_port"])
          EOF
      - name: Upload generated config
        uses: actions/upload-artifact@v6
        with:
          name: singbox-sample-config
          path: /tmp/singbox.json

  singbox-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: singbox-sample-config
          path: /tmp
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
          ./sing-box-*/sing-box version
      - name: Validate config with sing-box check
        run: ./sing-box-*/sing-box check -c /tmp/singbox.json

  live-snapshot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch real VPNGate snapshot
        run: |
          curl -m 90 -sSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv \
            || curl -m 90 -sSL http://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          wc -c /tmp/vpngate.csv
          grep -c -v '^\*' /tmp/vpngate.csv
      - name: Convert top TCP nodes
        run: |
          python vpngate_to_singbox.py --csv /tmp/vpngate.csv \
            --limit 8 --output /tmp/singbox-live.json --tag vpngate
          python - <<'EOF'
          import json
          cfg = json.load(open("/tmp/singbox-live.json"))
          assert len(cfg["endpoints"]) >= 1, "no TCP endpoints converted"
          for ep in cfg["endpoints"]:
              assert ep["network"] == "tcp" and ep["system"] is False, ep
          print("live endpoints:", [(e["server"], e["server_port"]) for e in cfg["endpoints"]])
          EOF
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
      - name: Validate live config with sing-box check
        run: ./sing-box-*/sing-box check -c /tmp/singbox-live.json

  live-dial:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch real VPNGate snapshot
        run: |
          curl -m 90 -sSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv \
            || curl -m 90 -sSL http://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
      - name: Convert top TCP nodes with mixed inbound
        run: |
          python vpngate_to_singbox.py --csv /tmp/vpngate.csv \
            --limit 3 --output /tmp/singbox-dial.json --tag vpngate \
            --mixed 127.0.0.1:18080
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
          ./sing-box-*/sing-box check -c /tmp/singbox-dial.json
      - name: Dial through VPNGate and verify exit IP
        run: |
          DIRECT_IP=$(curl -m 20 -s https://api.ipify.org)
          echo "runner direct IP: $DIRECT_IP"
          for i in 0 1 2; do
            pkill -f singbox-try || true
            python - "$i" <<'EOF'
          import json, sys
          i = sys.argv[1]
          cfg = json.load(open("/tmp/singbox-dial.json"))
          cfg["route"]["final"] = f"vpngate-{i}"
          json.dump(cfg, open("/tmp/singbox-try.json", "w"), indent=2)
          print("trying endpoint vpngate-" + i)
          EOF
            ./sing-box-*/sing-box run -c /tmp/singbox-try.json > /tmp/singbox-run.log 2>&1 &
            sleep 25
            if EXIT_IP=$(curl -m 60 -s -x socks5h://127.0.0.1:18080 https://api.ipify.org); then
              echo "exit IP via vpngate-$i: $EXIT_IP"
              if [ -n "$EXIT_IP" ] && [ "$EXIT_IP" != "$DIRECT_IP" ]; then
                echo "DIAL OK: traffic exits via VPNGate, no TUN used"
                pkill -f singbox-try || true
                exit 0
              fi
            fi
            echo "attempt vpngate-$i failed, see log tail:"
            tail -n 20 /tmp/singbox-run.log || true
          done
          pkill -f singbox-try || true
          echo "all dial attempts failed"
          exit 1

  live-stability:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch real VPNGate snapshot
        run: |
          curl -m 90 -sSL https://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv \
            || curl -m 90 -sSL http://www.vpngate.net/api/iphone/ -o /tmp/vpngate.csv
          python vpngate_to_singbox.py --csv /tmp/vpngate.csv \
            --limit 3 --output /tmp/singbox-stab.json --tag vpngate \
            --mixed 127.0.0.1:18080
      - name: Download sing-box v1.14.0
        run: |
          curl -Ls https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz | tar xz
          ./sing-box-*/sing-box check -c /tmp/singbox-stab.json
      - name: Probe stability (6x latency + 10MB download per endpoint)
        run: |
          : > /tmp/probe.jsonl
          record() { python3 - "$@" <<'EOF'
          import json, sys
          rec = {"endpoint": sys.argv[1], "kind": sys.argv[2], "ok": sys.argv[3] == "1",
                 "seconds": float(sys.argv[4]), "mbps": float(sys.argv[5]) if len(sys.argv) > 5 else 0.0}
          open("/tmp/probe.jsonl", "a").write(json.dumps(rec) + "\n")
          print(rec, flush=True)
          EOF
          }
          for i in 0 1 2; do
            pkill -f singbox-stab || true
            python3 - "$i" <<'EOF'
          import json, sys
          cfg = json.load(open("/tmp/singbox-stab.json"))
          cfg["route"]["final"] = "vpngate-" + sys.argv[1]
          json.dump(cfg, open("/tmp/singbox-stab-try.json", "w"), indent=2)
          print("probing endpoint vpngate-" + sys.argv[1], flush=True)
          EOF
            ./sing-box-*/sing-box run -c /tmp/singbox-stab-try.json > /tmp/singbox-stab.log 2>&1 &
            sleep 25
            for r in 1 2 3 4 5 6; do
              if out=$(curl -m 20 -s -o /dev/null -x socks5h://127.0.0.1:18080 \
                  -w "%{http_code} %{time_total}" https://www.gstatic.com/generate_204); then
                set -- $out
                if [ "$1" = "204" ]; then record "vpngate-$i" latency 1 "$2"; else record "vpngate-$i" latency 0 "$2"; fi
              else
                record "vpngate-$i" latency 0 0
              fi
              sleep 8
            done
            if out=$(curl -m 90 -s -o /dev/null -x socks5h://127.0.0.1:18080 \
                -w "%{http_code} %{time_total} %{size_download}" "https://speed.cloudflare.com/__down?bytes=10000000"); then
              set -- $out
              mbps=$(python3 -c "print(round($3*8/float($2)/1e6, 2) if float($2) > 0 else 0)")
              if [ "$1" = "200" ] && [ "$3" != "0" ]; then record "vpngate-$i" speed 1 "$2" "$mbps"; else record "vpngate-$i" speed 0 "$2" 0; fi
            else
              record "vpngate-$i" speed 0 0 0
            fi
          done
          pkill -f singbox-stab || true
          echo "--- probe.jsonl ---"
          cat /tmp/probe.jsonl
      - name: Summarize and gate
        run: |
          python scripts/summarize_probe.py --input /tmp/probe.jsonl --summary-file "$GITHUB_STEP_SUMMARY"
